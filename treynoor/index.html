<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gold Price</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="treynoor-monogram-gold.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600&family=IBM+Plex+Sans+Arabic:wght@400;600&family=Inter:wght@400;600&family=Outfit:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Treynoor theme (Night) — tokens from Treynoor-Design-Tokens.json.
     Webpage by default. OBS overlay: ?obs=1 (transparent); ?obs=1&bg=1 keeps the panel. ?scale=1.5 resizes. */
  :root {
    --scale: 1;
    --gold-500: #E4C063; --gold-300: #EBC676; --gold-700: #C39F4F; --gold-ink: #E4C063;
    --surface: #12110E; --surface-raised: #1E1C17; --ink: #F4EEE1; --ink-muted: #B3AA98; --line: #3A352B; --on-gold: #16140F;
    --accent: var(--gold-500);
    --up: var(--gold-300); --down: var(--ink-muted);            /* brand: no red/green pairs; arrows carry direction */
    --chart-line: var(--gold-500); --stale: var(--gold-700); --motif: .07;
    --arrow-up: #7CC49A; --arrow-down: #E08A82;                 /* soft green / soft red, arrows only */
    --silver-ink: #CDD2D9;                                      /* "Silver" title on Night */
    color-scheme: dark;
    --font-display: "Outfit", "Montserrat", system-ui, sans-serif;
    --font-sans: "Inter", system-ui, sans-serif;
    --font-ar-display: "Alexandria", "Readex Pro", "Noto Kufi Arabic", sans-serif;
    --font-ar: "IBM Plex Sans Arabic", "Noto Sans Arabic", sans-serif;
  }
  /* Day theme: chosen by ?theme=light / the switch, or automatically when the device is in light mode. */
  :root[data-theme="light"] {
    --gold-ink: #7D5F17; --surface: #FAF7F0; --surface-raised: #F1EBDD; --ink: #16140F; --ink-muted: #5E574B; --line: #DDD3BF;
    --up: var(--gold-ink); --chart-line: var(--gold-ink); --stale: var(--gold-ink); --motif: .14; --arrow-up: #3E8A5E; --arrow-down: #B4534B;
    --silver-ink: #5C626B;
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --gold-ink: #7D5F17; --surface: #FAF7F0; --surface-raised: #F1EBDD; --ink: #16140F; --ink-muted: #5E574B; --line: #DDD3BF;
      --up: var(--gold-ink); --chart-line: var(--gold-ink); --stale: var(--gold-ink); --motif: .14; --arrow-up: #3E8A5E; --arrow-down: #B4534B;
      --silver-ink: #5C626B;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: var(--surface); color: var(--ink); min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 32px 16px; }
  [dir="rtl"] body { font-family: var(--font-ar); }
  html.obs, html.obs body { background: transparent; overflow: hidden; }
  html.obs body { display: block; min-height: 0; padding: 0; }

  #card {
    position: relative; overflow: hidden;
    width: min(calc(380px * var(--scale)), 100%);
    padding: calc(26px * var(--scale)) calc(24px * var(--scale)) calc(20px * var(--scale));
    background: transparent; border: 1px solid transparent; border-radius: 0;
    color: var(--ink);
    font-size: calc(16px * var(--scale));
    opacity: 0; transform: translateY(12px);
    transition: opacity .8s ease, transform .8s ease;
  }
  [dir="rtl"] #card { font-size: calc(17px * var(--scale)); }
  #card.on { opacity: 1; transform: none; }
  #card.panel { background: var(--surface-raised); border-color: var(--line); border-top-color: var(--gold-500); }
  /* Motif: the monogram's rays and arcs, cropped off the top corner, low strength */
  #card.panel::before { content: ""; position: absolute; top: -70px; inset-inline-end: -70px; width: 200px; height: 200px; pointer-events: none; opacity: var(--motif);
    background: radial-gradient(circle, var(--gold-500) 0 14px, transparent 15px 34px, var(--gold-500) 35px 36px, transparent 37px 56px, var(--gold-500) 57px 58px, transparent 59px 78px, var(--gold-500) 79px 80px, transparent 81px); }
  #card > * { position: relative; }

  .brand { display: flex; justify-content: center; align-items: center; gap: 10px; height: calc(30px * var(--scale)); }
  .brand > span { display: flex; align-items: center; gap: 10px; height: 100%; }
  .brand img { display: block; height: 100%; width: auto; }
  .brand .ar { display: none; }
  [dir="rtl"] .brand .en { display: none; }
  [dir="rtl"] .brand .ar { display: flex; }
  .brand .ar img.wm { height: 100%; }

  .head { display: flex; justify-content: center; margin-top: 1.1em; padding-top: .9em; border-top: 1px solid var(--line); }
  .title { font-family: var(--font-display); font-size: 2em; font-weight: 500; line-height: 1.15; color: var(--gold-ink); }
  [dir="rtl"] .title { font-family: var(--font-ar-display); font-size: 1.9em; line-height: 1.5; }   /* Alexandria; never letter-space Arabic */
  /* Silver view: every title in silver (main title, section titles, chosen chart range) */
  [data-metal="silver"] .title, [data-metal="silver"] .bars caption span, [data-metal="silver"] .wk-title,
  [data-metal="silver"] .rng button.on { color: var(--silver-ink); }
  [data-metal="silver"] .rng button.on { border-color: var(--silver-ink); }
  .unit { text-align: center; font-size: .82em; color: var(--ink-muted); margin-top: .2em; }

  .row { display: flex; justify-content: center; align-items: baseline; margin-top: .3em; font-variant-numeric: tabular-nums; }
  .row .val { font-family: var(--font-display); font-size: 3em; font-weight: 500; line-height: 1.1; letter-spacing: .01em; transition: opacity .4s ease; }
  .val.out { opacity: 0; }
  .tog-row { display: flex; flex-wrap: wrap; justify-content: center; gap: .5em .6em; margin-top: .8em; }
  .tog-row.top { justify-content: space-between; margin-top: .9em; }   /* language and theme at the two edges */
  #card.old #time::after { content: " • " attr(data-stale); color: var(--stale); }
  .chart { direction: ltr; }
  .wk-stats { flex-wrap: wrap; gap: .15em .8em; }
  .wk-stats > span { white-space: nowrap; }
  .rs { display: inline-block; width: .82em; height: .9em; fill: currentColor; vertical-align: -.08em; margin-inline-end: .14em; }
  .amt { white-space: nowrap; }
  .ds { margin-inline-end: .06em; }
  [dir="rtl"] .wk-note, [dir="rtl"] .unit { line-height: 1.6; }

  .foot { display: flex; justify-content: space-between; align-items: baseline; font-size: .95em; color: var(--ink-muted); border-top: 1px solid var(--line); padding-top: .6em; margin-top: .7em; font-variant-numeric: tabular-nums; }
  .arr.up { color: var(--arrow-up); }
  .arr.down { color: var(--arrow-down); }
  #chg.up, #wk-chg.up { color: var(--up); }
  #chg.down, #wk-chg.down { color: var(--down); }

  .bars { width: 100%; border-collapse: collapse; margin-top: 1.1em; font-size: .95em; font-variant-numeric: tabular-nums; transition: opacity .4s ease; }
  .bars.out { opacity: 0; }
  .bars caption { text-align: start; padding-bottom: .5em; }
  .bars caption span { font-size: .8em; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-ink); }
  [dir="rtl"] .bars caption span { letter-spacing: 0; text-transform: none; font-size: .88em; }
  .bars caption small { color: var(--ink-muted); font-weight: 400; font-size: .78em; margin-inline-start: .6em; }
  .bars th { color: var(--ink-muted); font-weight: 400; font-size: .82em; text-align: end; padding: .2em 0 .35em; border-bottom: 1px solid var(--line); }
  .bars th:first-child, .bars td:first-child { text-align: start; }
  .bars td { text-align: end; padding: .45em 0; color: var(--ink); }
  .bars td:first-child { color: var(--ink); font-weight: 600; }
  .bars tr + tr td { border-top: 1px solid var(--line); }
  .bars td + td, .bars th + th { padding-inline-start: .8em; }

  .wk { margin-top: 1.2em; border-top: 1px solid var(--line); padding-top: .9em; }
  .wk-head { display: flex; justify-content: space-between; align-items: center; }
  .wk-title { font-size: .8em; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-ink); }
  [dir="rtl"] .wk-title { letter-spacing: 0; text-transform: none; font-size: .88em; }
  .tog { display: inline-flex; border: 1px solid var(--line); border-radius: 2px; padding: 2px; }
  .tog button { font: inherit; font-size: .78em; font-weight: 600; color: var(--ink-muted); background: none; border: 0; border-radius: 2px; padding: .25em .85em; cursor: pointer; }
  .tog button:hover { color: var(--ink); }
  .tog button.on { background: var(--gold-500); color: var(--on-gold); }
  .tog button.on:hover { background: var(--gold-300); }
  .tog button:focus-visible, .rng button:focus-visible { outline: 1px solid var(--gold-500); outline-offset: 2px; }
  .wk-stats { display: flex; justify-content: space-between; align-items: baseline; margin-top: .55em; font-size: .92em; color: var(--ink); font-variant-numeric: tabular-nums; }
  #wk-hl { color: var(--ink-muted); font-size: .92em; }
  .chart { position: relative; margin-top: .5em; height: calc(190px * var(--scale)); touch-action: pan-y; }
  #wk-svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .chart .grid { stroke: var(--line); stroke-width: 1; }
  .chart .ylab, .chart .xlab { fill: var(--ink-muted); font-size: 11px; font-family: var(--font-sans); font-variant-numeric: tabular-nums; }
  [dir="rtl"] .chart .xlab { font-family: var(--font-ar); }
  .chart .line { fill: none; stroke: var(--chart-line); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .chart .cross { stroke: var(--ink-muted); stroke-width: 1; stroke-dasharray: 2 3; }
  .chart .dot { fill: var(--chart-line); stroke: var(--surface-raised); stroke-width: 2; }
  .tip { position: absolute; top: 0; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 0; padding: .35em .6em; font-size: .8em; white-space: nowrap; color: var(--ink); opacity: 0; transition: opacity .15s; font-variant-numeric: tabular-nums; }
  .tip small { display: block; color: var(--ink-muted); }
  .wk-note { margin-top: .5em; font-size: .72em; color: var(--ink-muted); }
  #wk-body { transition: opacity .3s ease; }
  #wk-body.out { opacity: 0; }
  .rng { display: inline-flex; gap: 2px; }
  .rng button { font: inherit; font-size: .74em; font-weight: 600; color: var(--ink-muted); background: none; border: 1px solid transparent; border-radius: 2px; padding: .1em .5em; cursor: pointer; font-variant-numeric: tabular-nums; }
  .rng button:hover { color: var(--ink); }
  .rng button.on { color: var(--gold-ink); border-color: var(--gold-500); }
  html.obs .tog-row { display: none; }
</style>
</head>
<body>

<!-- New Saudi Riyal sign (glyph from @emran-alhaddad/saudi-riyal-font, SIL Open Font License 1.1) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="riyal-sign" viewBox="40 0 1150 1270"><path d="M750,1119C730,1163,716,1211,711,1262L1136,1172C1156,1127,1169,1079,1174,1028L750,1119Z M1136,901C1156,857,1169,809,1174,758L843,828L843,693L1136,631C1156,587,1169,538,1174,488L843,558L843,72C793,100,748,138,711,183L711,586L579,614L579,6C528,34,483,72,447,117L447,642L151,705C131,750,117,798,112,849L447,777L447,948L88,1024C68,1068,55,1117,50,1167L425,1088C456,1081,482,1063,499,1038L568,936C575,926,579,913,579,899L579,749L711,721L711,992L1136,901Z"/></symbol>
</defs></svg>

<div id="card">
  <div class="brand">
    <span class="en"><img data-logo="treynoor-logo-horizontal" src="treynoor-logo-horizontal-gold.svg" alt="Treynoor"></span>
    <span class="ar"><img data-logo="treynoor-monogram" src="treynoor-monogram-gold.svg" alt=""><img class="wm" data-logo="treynoor-wordmark-ar" src="treynoor-wordmark-ar.svg" alt="ترينور"></span>
  </div>
  <!-- Under the logo: language switch at one edge, theme switch at the other -->
  <div class="tog-row top">
    <div class="tog" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="ar" lang="ar">ع</button></div>
    <div class="tog" role="group" aria-label="Theme"><button type="button" data-theme-btn="dark" aria-label="Dark">☾</button><button type="button" data-theme-btn="light" aria-label="Light">☀</button></div>
  </div>
  <div class="head"><div class="title" data-i18n="title">Gold</div></div>
  <div class="unit" data-i18n="unit">Spot price · per troy ounce</div>
  <div class="tog-row">
    <div class="tog" role="group" aria-label="Metal"><button type="button" data-metal="gold" data-i18n="mGold">Gold</button><button type="button" data-metal="silver" data-i18n="mSilver">Silver</button></div>
    <div class="tog" role="group" aria-label="Currency"><button type="button" data-cur="USD">USD</button><button type="button" data-cur="SAR">SAR</button></div>
  </div>
  <div class="row"><span class="val" id="price">--</span></div>
  <div class="foot"><span id="chg" dir="ltr">—</span><span id="time" data-i18n="loading">Loading…</span></div>
  <table class="bars" id="bars">
    <caption><span data-i18n="bullion">Bullion</span><small data-i18n="bullionNote">24K spot value, no premium</small></caption>
    <thead><tr><th data-i18n="size">Size</th><th data-i18n="priceCol">Price</th></tr></thead>
    <tbody id="bars-body"></tbody>
  </table>
  <div class="wk">
    <div class="wk-head">
      <span class="wk-title" id="wk-title">Past 7 days</span>
      <div class="rng" role="group" aria-label="Chart range"><button type="button">7D</button><button type="button">30D</button><button type="button">1Y</button></div>
    </div>
    <div id="wk-body">
      <div class="wk-stats"><span id="wk-chg" dir="ltr">—</span><span id="wk-hl"></span></div>
      <div class="chart" id="chart"><svg id="wk-svg" role="img" aria-label="Gold price chart"></svg><div class="tip" id="tip"></div></div>
    </div>
  </div>
</div>

<script>
(() => {
  // Optional URL params: ?obs=1 (transparent overlay), &bg=1 (panel in overlay), ?scale=1.5, ?accent=%23c8102e
  const q = new URLSearchParams(location.search);
  const obs = q.get('obs') === '1';
  if (obs) document.documentElement.classList.add('obs');
  if (q.get('scale')) document.documentElement.style.setProperty('--scale', q.get('scale'));
  if (!obs || q.get('bg') === '1') document.getElementById('card').classList.add('panel');
  if (q.get('accent')) document.documentElement.style.setProperty('--accent', q.get('accent'));

  // Two metals, one page: spot price in USD per troy ounce from gold-api.com (free, no key).
  const METALS = {
    gold:   { url: 'https://api.gold-api.com/price/XAU', key: 'gold-widget-price-v1',        rangeKey: '-v1' },
    silver: { url: 'https://api.gold-api.com/price/XAG', key: 'gold-widget-price-silver-v1', rangeKey: '-silver-v1' },
  };
  const REFRESH_MS = 5 * 60 * 1000;                            // every 5 minutes
  const SAR_RATE = 3.76;                                        // fixed: 1 USD = 3.76 SAR
  const GRAMS_PER_OZ = 31.1034768;                              // troy ounce
  // Bullion sizes in grams (labels in T.sizes / T.sizes_silver, same order).
  const BARS = { gold: [1, GRAMS_PER_OZ, 1000], silver: [GRAMS_PER_OZ, 10 * GRAMS_PER_OZ, 1000, 100 * GRAMS_PER_OZ] };   // smallest to largest
  const $ = id => document.getElementById(id);

  // One currency for the whole page. Default SAR; ?cur=USD|SAR wins, else the viewer's last choice.
  const CUR_KEY = 'gold-widget-cur';
  let cur = 'SAR';
  const qc = (q.get('cur') || '').toUpperCase();
  if (qc === 'USD' || qc === 'SAR') cur = qc;
  else { try { if (localStorage.getItem(CUR_KEY) === 'USD') cur = 'USD'; } catch (e) {} }
  const conv = v => cur === 'SAR' ? v * SAR_RATE : v;

  // Metal: gold (default) or silver. ?metal=gold|silver wins, else the viewer's last choice.
  const METAL_KEY = 'gold-widget-metal';
  let metal = 'gold';
  const qm = (q.get('metal') || '').toLowerCase();
  if (qm === 'gold' || qm === 'silver') metal = qm;
  else { try { if (localStorage.getItem(METAL_KEY) === 'silver') metal = 'silver'; } catch (e) {} }

  // Language: English (default) or Arabic (right-to-left, Western digits). ?lang=ar|en wins, else last choice.
  const LANG_KEY = 'gold-widget-lang';
  const T = {
    en: { title: 'Gold', unit: 'Spot price · per troy ounce · 999.9 fine', loading: 'Loading…', bullion: 'Bullion', bullionNote: '999.9 fine · spot value, no premium',
          size: 'Size', priceCol: 'Price', note: 'Chart based on PAX Gold, a digital token backed by real gold, so it follows the gold price closely',
          rngTitle: ['Past 7 days', 'Past 30 days', 'Past year'], rngShort: ['7D', '30D', '1Y'],
          USD: 'USD', SAR: 'SAR', hi: 'H', lo: 'L', stale: 'stale', noPrice: 'Price unavailable', noChart: 'Chart unavailable',
          sizes: ['1 g', '1 oz (31.10 g)', '1 kg'], locale: 'en-GB',
          mGold: 'Gold', mSilver: 'Silver', doc: 'Gold Price', chartLabel: 'Gold price chart',
          // silver versions of the metal-specific texts (key + '_silver')
          title_silver: 'Silver', unit_silver: 'Spot price · per troy ounce · 999 fine', bullionNote_silver: '999 fine · spot value, no premium',
          doc_silver: 'Silver Price', chartLabel_silver: 'Silver price chart',
          sizes_silver: ['1 oz (31.10 g)', '10 oz (311.03 g)', '1 kg', '100 oz (3.11 kg)'] },
    ar: { title: 'الذهب', unit: 'السعر الفوري · للأونصة · نقاوة 999.9', loading: 'جارٍ التحميل…', bullion: 'السبائك', bullionNote: 'نقاوة 999.9 · قيمة فورية، بدون رسوم',
          size: 'الوزن', priceCol: 'السعر', note: 'الرسم مبني على PAX Gold، وهو رمز رقمي مغطّى بذهب حقيقي، لذا يتبع سعر الذهب عن قرب',
          rngTitle: ['آخر 7 أيام', 'آخر 30 يوماً', 'آخر سنة'], rngShort: ['7 أيام', '30 يوماً', 'سنة'],
          USD: 'دولار', SAR: 'ريال', hi: 'أعلى', lo: 'أدنى', stale: 'غير محدّث', noPrice: 'السعر غير متاح', noChart: 'الرسم غير متاح',
          sizes: ['1 غرام', '1 أونصة (31.10 غرام)', '1 كيلو'], locale: 'ar-u-nu-latn-ca-gregory',
          mGold: 'ذهب', mSilver: 'فضة', doc: 'سعر الذهب', chartLabel: 'رسم سعر الذهب',
          title_silver: 'الفضة', unit_silver: 'السعر الفوري · للأونصة · نقاوة 999', bullionNote_silver: 'نقاوة 999 · قيمة فورية، بدون رسوم',
          doc_silver: 'سعر الفضة', chartLabel_silver: 'رسم سعر الفضة',
          sizes_silver: ['1 أونصة (31.10 غرام)', '10 أونصات (311.03 غرام)', '1 كيلو', '100 أونصة (3.11 كيلو)'] },
  };
  let lang = 'en';
  const ql = (q.get('lang') || '').toLowerCase();
  if (ql === 'ar' || ql === 'en') lang = ql;
  else { try { if (localStorage.getItem(LANG_KEY) === 'ar') lang = 'ar'; } catch (e) {} }
  // Text for the current language; a silver-specific version (key_silver) wins when silver is shown.
  const t = k => (metal === 'silver' && T[lang][k + '_silver'] !== undefined) ? T[lang][k + '_silver'] : T[lang][k];
  function applyLang() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    document.title = t('doc');
    document.documentElement.dataset.metal = metal;            // silver title colour
    $('wk-svg').setAttribute('aria-label', t('chartLabel'));
    document.querySelectorAll('[data-i18n]').forEach(el => {
      if (el.id === 'time' && el.dataset.filled) return;   // time is filled by render
      el.textContent = t(el.dataset.i18n);
    });
    $('time').dataset.stale = t('stale');
  }
  applyLang();

  // Theme: Night (dark) or Day (light). ?theme=dark|light wins (fixed screens), else the viewer's
  // saved choice, else the device's own light/dark setting (followed live).
  const THEME_KEY = 'gold-widget-theme';
  const lightMQ = matchMedia('(prefers-color-scheme: light)');
  let themeChoice = null;
  const qt = (q.get('theme') || '').toLowerCase();
  if (qt === 'dark' || qt === 'light') themeChoice = qt;
  else { try { const s = localStorage.getItem(THEME_KEY); if (s === 'dark' || s === 'light') themeChoice = s; } catch (e) {} }
  const theme = () => themeChoice || (lightMQ.matches ? 'light' : 'dark');
  function applyTheme() {
    if (themeChoice) document.documentElement.dataset.theme = themeChoice;
    else delete document.documentElement.dataset.theme;
    const th = theme();
    // Logo: gold foil on Night, ink on Day (brand guide).
    document.querySelectorAll('img[data-logo]').forEach(img => {
      const base = img.dataset.logo;
      img.src = th === 'light' ? `${base}-ink.svg` : (base === 'treynoor-wordmark-ar' ? `${base}.svg` : `${base}-gold.svg`);
    });
    document.querySelectorAll('.tog button[data-theme-btn]').forEach(b => {
      const on = b.dataset.themeBtn === th; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on);
    });
  }
  applyTheme();
  lightMQ.addEventListener('change', () => { if (!themeChoice) applyTheme(); });
  document.querySelectorAll('.tog button[data-theme-btn]').forEach(b => b.addEventListener('click', () => {
    themeChoice = b.dataset.themeBtn;
    try { localStorage.setItem(THEME_KEY, themeChoice); } catch (e) {}
    applyTheme();
  }));

  // Memory copy first, so change/stale still work where browser storage is blocked.
  const mem = {};
  const load = k => { if (mem[k]) return mem[k]; try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const save = (k, v) => { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const money = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  // Amount as HTML: the currency sign (new Saudi Riyal sign or $) sits right before the number, kept left-to-right.
  const RIYAL = '<svg class="rs" aria-label="SAR" role="img"><use href="#riyal-sign"/></svg>';
  const amt = n => `<bdi dir="ltr" class="amt">${cur === 'SAR' ? RIYAL : '<span class="ds">$</span>'}${money(n)}</bdi>`;
  const clock = ts => new Date(ts).toLocaleString(t('locale'), { timeZone: 'Asia/Riyadh', hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });

  async function fetchJson(url) {
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  }

  // Show the price in the selected currency, change since the previous refresh, and time of the price.
  // SAR = unrounded USD x 3.76; every value is rounded to 2 decimals only when displayed.
  let lastShown = null;
  function render(p, stale) {
    lastShown = [p, stale];
    const price = $('price'), bars = $('bars');
    price.classList.add('out'); bars.classList.add('out');
    setTimeout(() => {
      price.innerHTML = amt(conv(p.usd));
      // Bullion table: grams x (spot / grams per ounce).
      const perGram = p.usd / GRAMS_PER_OZ, sizes = t('sizes');
      $('bars-body').innerHTML = BARS[metal].map((g, i) =>
        `<tr><td>${sizes[i]}</td><td>${amt(conv(g * perGram))}</td></tr>`).join('');
      price.classList.remove('out'); bars.classList.remove('out');
    }, 400);
    const chg = $('chg');
    chg.className = '';
    if (p.prev != null && p.prev > 0) {
      const d = p.usd - p.prev, pct = d / p.prev * 100;
      const sign = d > 0 ? '<span class="arr up">▲</span> +' : d < 0 ? '<span class="arr down">▼</span> −' : '';
      chg.innerHTML = d === 0 ? `${amt(0)} (0.00%)` : `${sign}${amt(Math.abs(conv(d)))} (${Math.abs(pct).toFixed(2)}%)`;
      if (d > 0) chg.classList.add('up'); else if (d < 0) chg.classList.add('down');
    } else {
      chg.textContent = '—';
    }
    $('time').textContent = clock(p.at);
    $('time').dataset.filled = '1';
    $('card').classList.toggle('old', !!stale);
    $('card').classList.add('on');
  }

  // Both metals are fetched every time, so switching is instant; only the shown metal is drawn.
  const shown = {};                                             // metal -> [price, stale]
  function showPrice() {
    if (shown[metal]) render(...shown[metal]);
    else { lastShown = null; $('price').textContent = '--'; $('bars-body').innerHTML = ''; $('chg').textContent = '—'; $('time').textContent = t('noPrice'); }
  }
  async function updateMetal(m) {
    const M = METALS[m], last = load(M.key);
    try {
      // Step 1: spot price in USD per ounce.
      const g = await fetchJson(M.url);
      if (typeof g.price !== 'number' || !(g.price > 0)) throw new Error('bad price');
      const at = g.updatedAt ? Date.parse(g.updatedAt) : Date.now();
      // Keep the previous comparison point when the source hasn't moved to a new quote yet.
      const prev = last ? (last.at === at ? last.prev : last.usd) : null;
      const p = { usd: g.price, at, prev };
      save(M.key, p);
      shown[m] = [p, false];
    } catch (e) {
      // Step 4: keep the last known price on screen and mark it stale.
      if (last) shown[m] = [last, true];
    }
  }
  async function update() {
    await Promise.all(Object.keys(METALS).map(updateMetal));
    showPrice();
    $('card').classList.add('on');
  }

  // ---- History chart: spot prices from history.json (PAXG candles from Binance as fallback), rotating 7 days -> 30 days -> 1 year ----
  // Binance's public market-data mirror: same data as api.binance.com, reachable from more countries.
  const KLINES = 'https://data-api.binance.vision/api/v3/klines?symbol=PAXGUSDT';
  const HISTORY_URL = '../history.json';                               // written once a day by the GitHub job
  const MIN = 60 * 1000, HOUR = 60 * MIN, RIYADH_OFFSET = 3 * HOUR;   // Riyadh is UTC+3 all year
  const RANGES = [
    { id: '7d',  interval: '1h', ms: HOUR,      n: 168, maxAge: 5 * MIN,  tick: 'day'   },   // hourly
    { id: '30d', interval: '4h', ms: 4 * HOUR,  n: 180, maxAge: 30 * MIN, tick: 'week'  },   // every 4 hours
    { id: '1y',  interval: '1d', ms: 24 * HOUR, n: 365, maxAge: 30 * MIN, tick: 'month' },   // daily
  ];
  const ROTATE_MS = 10 * 1000;
  const data = {};                                              // metal -> range id -> chart data
  const rangeKey = (m, id) => 'gold-widget-range-' + id + METALS[m].rangeKey;
  Object.keys(METALS).forEach(m => { data[m] = {}; RANGES.forEach(r => { data[m][r.id] = load(rangeKey(m, r.id)); }); });
  let ri = 0, paused = false;

  const fmt = (ts, o) => new Date(ts).toLocaleString(t('locale'), Object.assign({ timeZone: 'Asia/Riyadh' }, o));
  const dayNum = ts => Math.floor((ts + RIYADH_OFFSET) / 86400000);
  // Tick key per point: a new tick starts where the key changes.
  const tickKey = { day: ts => dayNum(ts), week: ts => Math.floor((dayNum(ts) + 4) / 7),   // weeks start Sunday
                    month: ts => fmt(ts, { year: 'numeric', month: 'numeric' }) };
  const tickLabel = { day: ts => fmt(ts, { weekday: 'short' }), week: ts => fmt(ts, { day: 'numeric', month: 'short' }),
                      month: ts => fmt(ts, { month: 'long' }) };
  const tipFmt = { '7d': { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' },
                   '30d': { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' },
                   '1y': { day: 'numeric', month: 'short', year: 'numeric' } };

  // Stored history first (spot prices, written every hour by the GitHub job), then the live price on top.
  // Re-read hourly so a page left open keeps up with the new hourly points.
  let hist = null, histAt = 0;
  async function loadHistory() {
    if (Date.now() - histAt < HOUR) return;
    histAt = Date.now();
    try {
      const h = await fetchJson(HISTORY_URL + '?h=' + Math.floor(Date.now() / HOUR));
      // Use it only if it is recent (allow a missed day).
      if (h && h.ranges && Date.now() - Date.parse(h.generatedAt) < 3 * 24 * HOUR) hist = h;
    } catch (e) { /* no file: fall back to fetching everything live */ }
  }
  const candles = k => ({ t: k.map(x => x[6] + 1), o: k.map(x => +x[1]), h: k.map(x => +x[2]), l: k.map(x => +x[3]), c: k.map(x => +x[4]) });
  const WINDOW = { '7d': 7 * 24 * HOUR, '30d': 31 * 24 * HOUR, '1y': 366 * 24 * HOUR };

  async function loadRange(m, r, force) {
    const cached = data[m][r.id];
    if (!force && cached && Date.now() - cached.at < r.maxAge) return;
    try {
      // t = end of each period. Gold sits at the top level of history.json, silver under "silver".
      const src = hist && (m === 'gold' ? hist : hist.silver);
      const base = src && src.ranges && src.ranges[r.id];
      const spot = !!(base && base.src && base.src !== 'paxg');
      if (m !== 'gold' && !(base && base.t && base.t.length > 1)) return;   // silver: no live fallback, keep the last data
      let s;
      if (base && base.t && base.t.length > 1) {
        s = { t: base.t.slice(), o: base.o.slice(), h: base.h.slice(), l: base.l.slice(), c: base.c.slice() };
        if (spot) {
          // Spot history: add the live spot price as the newest point.
          const p = load(METALS[m].key), lastT = s.t[s.t.length - 1];
          if (p && p.usd > 0 && p.at > lastT) ['t', 'o', 'h', 'l', 'c'].forEach(f => s[f].push(f === 't' ? p.at : p.usd));
        } else {
          // PAXG history: top up with the Binance candles since the file was written.
          try {
            const k = await fetchJson(`${KLINES}&interval=${r.interval}&startTime=${s.t[s.t.length - 1]}&limit=1000`);
            const live = candles(Array.isArray(k) ? k : []);
            live.t.forEach((tt, i) => {
              if (tt <= s.t[s.t.length - 1]) return;
              ['t', 'o', 'h', 'l', 'c'].forEach(f => s[f].push(live[f][i]));
            });
          } catch (e) { /* top-up failed: the stored file alone is still useful */ }
        }
      } else {
        // [openTime, open, high, low, close, volume, closeTime, ...]
        s = candles(await fetchJson(`${KLINES}&interval=${r.interval}&limit=${r.n}`));
      }
      // Keep the window for this range: by time for spot, by candle count for PAXG.
      let from = Math.max(0, s.t.length - r.n);
      if (spot) { from = s.t.findIndex(tt => tt > Date.now() - WINDOW[r.id]); if (from < 0) from = 0; }
      ['t', 'o', 'h', 'l', 'c'].forEach(f => { s[f] = s[f].slice(from); });
      if (s.t.length < 2 || s.c.some(v => !(v > 0))) throw new Error('bad data');
      const w = { t: s.t, c: s.c, open: s.o[0], hi: Math.max(...s.h), lo: Math.min(...s.l), at: Date.now() };
      data[m][r.id] = w; save(rangeKey(m, r.id), w);
    } catch (e) { /* keep the last data for this range */ }
  }
  async function loadRanges(force) {
    await loadHistory();
    await Promise.all(Object.keys(METALS).flatMap(m => RANGES.map(r => loadRange(m, r, force))));
    drawChart();
  }

  // Range indicator: 7D · 30D · 1Y (tap to jump).
  function markRange() {
    document.querySelectorAll('.rng button').forEach((b, i) => {
      b.textContent = t('rngShort')[i];
      b.classList.toggle('on', i === ri);
      b.setAttribute('aria-pressed', i === ri);
    });
    $('wk-title').textContent = t('rngTitle')[ri];
  }
  let rotTimer;
  function showRange(i) {
    const body = $('wk-body');
    body.classList.add('out');
    setTimeout(() => { ri = i; drawChart(); body.classList.remove('out'); }, 300);
    clearInterval(rotTimer);
    rotTimer = setInterval(() => { if (!paused) showRange((ri + 1) % RANGES.length); }, ROTATE_MS);
  }
  document.querySelectorAll('.rng button').forEach((b, i) => b.addEventListener('click', () => { if (i !== ri) showRange(i); }));

  let pts = [];
  function drawChart() {
    markRange();
    const svg = $('wk-svg'), r = RANGES[ri], week = data[metal][r.id];
    if (!week) { $('wk-chg').textContent = t('noChart'); $('wk-hl').textContent = ''; svg.innerHTML = ''; pts = []; return; }
    const last = week.c[week.c.length - 1], d = last - week.open, pct = d / week.open * 100;
    const chg = $('wk-chg');
    chg.className = d > 0 ? 'up' : d < 0 ? 'down' : '';
    chg.innerHTML = `${d > 0 ? '<span class="arr up">▲</span> +' : d < 0 ? '<span class="arr down">▼</span> −' : ''}${amt(Math.abs(conv(d)))} (${Math.abs(pct).toFixed(2)}%)`;
    $('wk-hl').innerHTML = `${t('hi')} <bdi>${amt(conv(week.hi))}</bdi> · ${t('lo')} <bdi>${amt(conv(week.lo))}</bdi>`;

    const W = svg.clientWidth || 320, H = svg.clientHeight || 150;
    const vertical = r.tick === 'month';                 // year view: full month names, written vertically
    const padR = 52, padB = vertical ? 62 : 18, padT = 6;
    const vals = week.c.map(conv);
    let min = Math.min(...vals), max = Math.max(...vals);
    const span = (max - min) || max * .001; min -= span * .08; max += span * .08;
    const n = vals.length, x = i => i / (n - 1) * (W - padR), y = v => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
    pts = vals.map((v, i) => [x(i), y(v), v, week.t[i]]);
    const line = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    const base = H - padB;

    let grid = '';
    [max - (max - min) * .08 / 1.16, (max + min) / 2, min + (max - min) * .08 / 1.16].forEach(v => {
      const yy = y(v).toFixed(1);
      // whole numbers for gold; silver's smaller prices keep 2 decimals so the labels stay distinct
      const lab = v < 1000 ? v.toFixed(2) : Math.round(v).toLocaleString('en-US');
      grid += `<line class="grid" x1="0" x2="${W - padR}" y1="${yy}" y2="${yy}"/><text class="ylab" x="${W - padR + 6}" y="${(+yy + 4).toFixed(1)}">${lab}</text>`;
    });
    let xl = '', lastLab = -1e9;
    const key = tickKey[r.tick], label = tickLabel[r.tick];
    const minGap = vertical ? 12 : lang === 'ar' ? 40 : 30;   // skip labels that would collide
    for (let i = 1; i < n; i++) {
      if (key(week.t[i]) !== key(week.t[i - 1])) {
        const xx = x(i).toFixed(1);
        xl += `<line class="grid" x1="${xx}" x2="${xx}" y1="${padT}" y2="${base}"/>`;
        if (x(i) - lastLab >= minGap && x(i) < W - padR - (vertical ? 8 : 14)) {
          xl += vertical
            ? `<text class="xlab" text-anchor="end" transform="translate(${(x(i) + 12).toFixed(1)} ${base + 5}) rotate(-90)">${label(week.t[i])}</text>`
            : `<text class="xlab" x="${(x(i) + 3).toFixed(1)}" y="${H - 4}">${label(week.t[i])}</text>`;
          lastLab = x(i);
        }
      }
    }
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    svg.innerHTML =
      grid + xl +
      `<path d="${line}L${pts[n - 1][0].toFixed(1)} ${base}L0 ${base}Z" fill="var(--gold-500)" fill-opacity=".08"/>` +
      `<path class="line" d="${line}"/>` +
      `<line class="cross" id="wk-cross" y1="${padT}" y2="${base}" visibility="hidden"/>` +
      `<circle class="dot" id="wk-dot" r="4.5" cx="${pts[n - 1][0]}" cy="${pts[n - 1][1]}"/>`;
  }

  // Crosshair + tooltip on hover/touch.
  const chartEl = $('chart'), tip = $('tip');
  function hover(ev) {
    if (!pts.length) return;
    const r = chartEl.getBoundingClientRect(), mx = ev.clientX - r.left;
    let i = Math.round(mx / pts[pts.length - 1][0] * (pts.length - 1));
    i = Math.max(0, Math.min(pts.length - 1, i));
    const [px, py, v, ts] = pts[i];
    const cross = $('wk-cross'), dot = $('wk-dot');
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', px); dot.setAttribute('cy', py);
    tip.innerHTML = `<span>${amt(v)}</span><small dir="auto">${fmt(ts, tipFmt[RANGES[ri].id])}</small>`;
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(0, Math.min(r.width - tw, px - tw / 2)) + 'px';
    tip.style.top = (py > 50 ? py - 46 : py + 12) + 'px';
    tip.style.opacity = 1;
  }
  function unhover() {
    tip.style.opacity = 0;
    if (!pts.length) return;
    const last = pts[pts.length - 1];
    $('wk-cross').setAttribute('visibility', 'hidden');
    $('wk-dot').setAttribute('cx', last[0]); $('wk-dot').setAttribute('cy', last[1]);
  }
  chartEl.addEventListener('pointermove', hover);
  chartEl.addEventListener('pointerdown', e => { paused = true; hover(e); });
  chartEl.addEventListener('pointerenter', () => { paused = true; });
  chartEl.addEventListener('pointerleave', () => { paused = false; unhover(); });

  // USD | SAR switch for the whole page (remembered per viewer).
  function wireSwitch(attr, get, set, key) {
    const btns = document.querySelectorAll(`.tog button[data-${attr}]`);
    const mark = () => btns.forEach(o => { const on = o.dataset[attr] === get(); o.classList.toggle('on', on); o.setAttribute('aria-pressed', on); });
    mark();
    btns.forEach(b => b.addEventListener('click', () => {
      if (get() === b.dataset[attr]) return;
      set(b.dataset[attr]);
      try { localStorage.setItem(key, get()); } catch (e) {}
      mark();
      applyLang();
      if (attr === 'metal') showPrice();
      else if (lastShown) render(...lastShown);
      drawChart();
    }));
  }
  wireSwitch('metal', () => metal, v => { metal = v; }, METAL_KEY);
  wireSwitch('cur', () => cur, v => { cur = v; }, CUR_KEY);
  wireSwitch('lang', () => lang, v => { lang = v; }, LANG_KEY);
  let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(drawChart, 150); });

  drawChart(); update().then(() => loadRanges(true));
  showRange(0);
  // Every 5 min: spot price; each chart range refreshes only once its data is older than its maxAge.
  setInterval(() => { update().then(() => loadRanges(false)); }, REFRESH_MS);
})();
</script>
</body>
</html>
