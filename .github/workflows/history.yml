name: Gold history

# One run records the spot price every hour for about 5.5 hours (scripts/collect.sh), then starts the
# next run, so the hourly record no longer depends on GitHub's timed starts (which are often skipped).
# Once a day it also fetches the daily spot history (uses the GOLD_API_KEY secret).
on:
  schedule:
    - cron: '37 */3 * * *'  # backup only: restarts the chain if it ever stops (waits if a run is active)
  workflow_dispatch:        # "Run workflow" button starts the chain by hand

permissions:
  contents: write
  pages: write
  actions: write            # lets a run start the next one

concurrency:
  group: gold-history
  cancel-in-progress: false # a new start waits for the active run instead of stopping it

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Record prices every hour
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/collect.sh

      - name: Start the next run
        if: always()
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/history.yml/dispatches" \
            -d '{"ref":"main"}'
