name: Daily gold history

on:
  schedule:
    - cron: '5 21 * * *'   # 21:05 UTC = 00:05 Riyadh, every day
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write
  pages: write

concurrency:
  group: gold-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update history.json
        run: python scripts/update_history.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- history.json; then
            echo "history.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Daily gold history $(date -u +%Y-%m-%d)"
          git push

      - name: Ask Pages to rebuild
        # Pushes made with the workflow token may not start a Pages build on their own.
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
