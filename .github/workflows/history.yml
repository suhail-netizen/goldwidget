name: Gold history

on:
  schedule:
    - cron: '2 * * * *'    # every hour: record the spot price (free endpoint, no key)
    - cron: '5 21 * * *'   # 21:05 UTC = 00:05 Riyadh: also fetch daily spot history (uses GOLD_API_KEY)
  workflow_dispatch:        # "Run workflow" button = full daily run

permissions:
  contents: write
  pages: write

concurrency:
  group: gold-history
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update history.json
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
          MODE: ${{ github.event.schedule == '2 * * * *' && 'hourly' || 'daily' }}
        run: python scripts/update_history.py "$MODE"

      - name: Commit if changed
        run: |
          if git diff --quiet -- history.json; then
            echo "history.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Gold history $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q || true
          git push

      - name: Ask Pages to rebuild
        # Pushes made with the workflow token may not start a Pages build on their own.
        run: |
          curl -sS -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
